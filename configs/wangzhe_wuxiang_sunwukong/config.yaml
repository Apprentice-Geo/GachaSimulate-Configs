pools:
- begin_pool:
  - probability: 0.004
    actions: random_limited_skin += 1
  - probability: 0.005
    actions: random_legendary_skin += 1
  - probability: 0.135
    actions: random_skin += 1
  - probability: 0.008
    actions: wuxiang_point += 68
  - probability: 0.04
    actions: wuxiang_point += 28
  - probability: 0.237
    actions: wuxiang_point += 18
