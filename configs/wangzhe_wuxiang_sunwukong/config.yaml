rules:
- draw_5:
    mode: once
    condition:
      check: draw_count >= 5
      actions:
      - random_skin += 1
- draw_10:
    mode: once
    condition:
      check: draw_count >= 10
      actions:
      - random_skin += 1
- draw_25:
